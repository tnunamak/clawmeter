name: CI

on:
  workflow_call:
  pull_request:
  # Main pushes are verified once by Release's same-SHA reusable calls.

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Linux tray deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libayatana-appindicator3-dev

      - name: go vet (no tags)
        run: go vet ./...

      - name: go vet (tray)
        run: go vet -tags tray ./...

      - name: go test (no tags)
        run: go test -race ./...

      - name: go test (tray)
        run: go test -race -tags tray ./...

      - name: extension tests
        run: node --test extension/*.test.js

      - name: Build smoke (no tray)
        run: go build ./cmd/clawmeter

      - name: Build smoke (tray)
        run: go build -tags tray ./cmd/clawmeter

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null
          Get-ChildItem packaging/windows -Filter *.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw $_.FullName)) | Out-Null
          }

      - name: Validate packaging shell scripts
        run: bash -n packaging/winget/generate.sh packaging/winget/submit-pr.sh packaging/winget/close-superseded-first-package-prs.sh

      - name: Run Windows packaging PowerShell tests
        shell: pwsh
        run: |
          Get-ChildItem packaging/windows -Filter test-*.ps1 | ForEach-Object {
            pwsh -NoProfile -File $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Packaging regression failed: $($_.Name)" }
          }

      - name: Run packaging Python regression tests
        run: |
          python3 -m unittest discover -s packaging/winget -p 'test_*.py'
          python3 -m unittest discover -s packaging/windows -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify Windows VM cleanup scope
        run: |
          bash -n scripts/windows-vm-smoke.sh scripts/test-windows-vm-smoke-scope.sh
          bash scripts/test-windows-vm-smoke-scope.sh
