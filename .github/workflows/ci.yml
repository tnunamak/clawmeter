name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Linux tray deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libayatana-appindicator3-dev

      - name: go vet (no tags)
        run: go vet ./...

      - name: go vet (tray)
        run: go vet -tags tray ./...

      - name: go test (no tags)
        run: go test -race ./...

      - name: go test (tray)
        run: go test -race -tags tray ./...

      - name: Build smoke (no tray)
        run: go build ./cmd/clawmeter

      - name: Build smoke (tray)
        run: go build -tags tray ./cmd/clawmeter

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null
          Get-ChildItem packaging/windows -Filter *.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content -Raw $_.FullName)) | Out-Null
          }

      - name: Validate packaging shell scripts
        run: bash -n packaging/winget/generate.sh packaging/winget/submit-pr.sh packaging/winget/close-superseded-first-package-prs.sh
